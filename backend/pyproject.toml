[project]
name = "atelier-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "fastapi-users[sqlalchemy]>=14",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "python-slugify>=8",
    "structlog>=24",
    "pillow>=12.2.0",
    "colorthief>=0.2.1",
    "imagehash>=4.3.2",
    "respx>=0.23.1",
    "freezegun>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 300

[tool.coverage.report]
omit = ["src/auth/quotas.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q"
